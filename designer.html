<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素拼豆设计器 · 拼豆星球 PIXELBEAD</title>
<meta name="description" content="拼豆星球在线拼豆设计器：自由绘制、照片转图案、等距 3D 积木预览，一键导出 PNG / STL 直接 3D 打印。">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="designer-nav">
  <a class="brand" href="index.html"><span class="logo"></span>拼豆星球</a>
  <div style="display:flex;gap:1rem;align-items:center;font-weight:700;">
    <span id="moduleLabel" style="font-size:.9rem;opacity:.7">像素拼豆设计器</span>
    <a class="btn btn-red" href="index.html">← 返回首页</a>
  </div>
</nav>

<div class="module-tabs" id="moduleTabs">
  <button data-mod="pixel" class="mtab active">🔴 像素拼豆</button>
  <button data-mod="cloisonne" class="mtab">🔵 掐丝珐琅</button>
  <button data-mod="architecture" class="mtab">🏛️ 建筑</button>
</div>

<div class="designer-wrap">

  <!-- 左：工具 + 调色板 + 预设 -->
  <aside class="panel">
    <h4>🛠 工具</h4>
    <div class="tool-row">
      <div class="tool active" data-tool="pen"><span class="gi">✏️</span>画笔</div>
      <div class="tool" data-tool="eraser"><span class="gi">🧽</span>橡皮</div>
      <div class="tool" data-tool="fill"><span class="gi">🪣</span>填充</div>
      <div class="tool" data-tool="picker"><span class="gi">💉</span>取色</div>
      <div class="tool" id="btnUndo"><span class="gi">↩️</span>撤销</div>
      <div class="tool" id="btnRedo"><span class="gi">↪️</span>重做</div>
    </div>

    <h4>🎨 调色板</h4>
    <div class="palette" id="palette"></div>

    <h4 style="margin-top:1rem">📐 画板尺寸</h4>
    <select class="mini-select" id="gridSize" style="width:100%;margin-bottom:.6rem">
      <option value="15">15 × 15（钥匙扣）</option>
      <option value="20">20 × 20（杯垫）</option>
      <option value="29">29 × 29（标准拼豆板）</option>
    </select>

    <h4>✨ 预设图案</h4>
    <div class="preset-row" id="presets"></div>
  </aside>

  <!-- 中：画板 -->
  <main class="canvas-stage">
    <div style="font-family:var(--font-disp);font-weight:800;font-size:1.2rem">🟦 拼豆画板</div>
    <canvas id="beadCanvas"></canvas>
    <div class="stage-tools">
      <button class="btn btn-orange" id="btnPhoto">📷 照片转图案</button>
      <button class="btn btn-ghost" id="btnClear">🗑 清空</button>
      <input type="file" id="photoInput" class="hidden-file" accept="image/*">
    </div>
    <p class="hint">按住鼠标拖动可连续画 · 支持触屏 · 数据全程在本地，不上传服务器</p>
  </main>

  <!-- 右：3D 预览 + 统计 + 导出 -->
  <aside class="panel">
    <h4>🧊 3D 积木预览</h4>
    <canvas id="isoCanvas"></canvas>
    <div class="stat-grid">
      <div class="stat"><div class="n" id="statBeads">0</div><div class="l">用豆总数</div></div>
      <div class="stat"><div class="n" id="statColors">0</div><div class="l">颜色数</div></div>
    </div>

    <h4>📦 导出</h4>
    <div class="export-list">
      <button class="export-btn" id="btnPng">⬇ PNG 图案图 <small>分享 / 打印</small></button>
      <button class="export-btn" id="btnStl">⬇ STL 3D 模型 <small>直接 3D 打印</small></button>
      <button class="export-btn" id="btnList">⬇ 用豆量清单 <small>CSV 采购表</small></button>
    </div>

    <h4 style="margin-top:1rem">📊 用豆统计</h4>
    <table class="bead-table"><tbody id="beadTable"></tbody></table>
  </aside>

</div>

<!-- 掐丝珐琅 · 七道工序引导（仅 cloisonné 模式显示） -->
<section id="processGuide" class="proc-sec" style="--accent:#006CB7" hidden>
  <div class="wrap proc-inner">
    <div class="proc-head">
      <span class="hero-badge">🪡 掐丝珐琅 · 七道工序</span>
      <h2>从线稿到珐琅胸针</h2>
      <p>按这七道工序一步步来：先在画板排好纹样当底稿，再到实物掐丝、点蓝、贴珠、烧制成品。</p>
    </div>

    <div class="proc-steps" id="procSteps"><!-- JS 注入 7 个步骤胶囊 --></div>

    <div class="proc-detail">
      <div class="proc-media"><img id="procImg" src="assets/img/process-1.svg" alt="贴线稿"></div>
      <div class="proc-text">
        <div class="proc-no" id="procNo">1 / 7</div>
        <h3 id="procTitle">贴线稿</h3>
        <p class="proc-desc" id="procDesc"></p>
        <div class="proc-tip" id="procTip"></div>
        <button class="btn btn-yellow" id="procAction" style="display:none;width:100%;justify-content:center;margin-top:.4rem"></button>
        <div class="proc-progress"><div class="proc-bar" id="procBar"></div></div>
        <div class="proc-nav">
          <button class="btn btn-ghost" id="procPrev">← 上一步</button>
          <button class="btn btn-red" id="procNext">下一步 →</button>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="assets/js/bead-core.js"></script>
<script src="assets/js/patterns.js"></script>
<script src="assets/js/designer.js"></script>
</body>
</html>
